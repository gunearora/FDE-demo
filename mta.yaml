_schema-version: "3.1"
ID: test_gr
version: 1.0.0
description: "Goods Receipt automation from delivery notes"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:
  # --- CAP Service (Node.js) ---
  - name: test_gr-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: test_gr-db
      - name: test_gr-xsuaa
      - name: test_gr-destination

  # --- HANA Deployer ---
  - name: test_gr-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: test_gr-db

  # --- App Router / UI ---
  - name: test_gr-app-router
    type: approuter.nodejs
    path: app
    parameters:
      disk-quota: 256M
      memory: 256M
    requires:
      - name: test_gr-xsuaa
      - name: test_gr-destination
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # --- HANA HDI Container ---
  - name: test_gr-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # --- XSUAA ---
  - name: test_gr-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: test_gr-${org}-${space}
        tenant-mode: dedicated

  # --- Destination Service ---
  - name: test_gr-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
