_schema-version: '3.1'
ID: gr-automation-app
version: 1.0.0
description: GR Automation from Delivery Notes

parameters:
  enable-parallel-deployments: true
  app-name: my-btp-app             # ← Change this ONE value to rename all apps and services

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - xcopy /E /I /Y app\webapp gen\srv\app\webapp

modules:

  # ---- CAP Node.js backend (also serves the UI via express.static) ----------
  - name: ${app-name}-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 1024M
      memory: 512M
    build-parameters:
      builder: npm
      ignore:
        - node_modules/
        - .env
        - default-env.json
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    requires:
      - name: ${app-name}-db
      - name: ${app-name}-xsuaa
      - name: ${app-name}-destination

  # ---- HANA DB deployer -------------------------------------------------------
  - name: ${app-name}-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      ignore:
        - node_modules/
    requires:
      - name: ${app-name}-db

resources:

  - name: ${app-name}-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: ${app-name}-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ${app-name}-${org}-${space}
        tenant-mode: dedicated

  - name: ${app-name}-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
